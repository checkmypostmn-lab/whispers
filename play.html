<style>
/* Layout: one full-screen canvas (the hidden world), quiet paper-like panels floating at the bottom. Single dark look by choice. */
:root{
  --night:#1b1530;      /* deep indigo-violet sky */
  --ink:#ece6f6;        /* pale lilac text */
  --mist:#a99cc6;       /* secondary text */
  --paper:#efe4cf;      /* old paper for the writing box */
  --paper-ink:#2c2340;  /* text on paper */
  --gold:#f2c46d;       /* warm light */
  --thread:#7fb4ff;     /* blue thread */
  --display:"Cormorant Garamond", Georgia, "Times New Roman", serif;
  --body:"Nunito", "Segoe UI", system-ui, sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--night);color:var(--ink);font-family:var(--body);overflow:hidden}
#world{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:manipulation}
.hud{position:fixed;top:calc(10px + env(safe-area-inset-top,0px));left:max(16px,env(safe-area-inset-left,0px));right:max(16px,env(safe-area-inset-right,0px));display:flex;justify-content:space-between;align-items:center;gap:12px;pointer-events:none;z-index:3}
.light{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--mist);letter-spacing:.04em}
.light .bar{width:min(120px,26vw);height:6px;border-radius:3px;background:rgba(255,255,255,.12);overflow:hidden}
.light .fill{height:100%;width:0;background:linear-gradient(90deg,#c9a7ff,var(--gold));transition:width .8s}
.light .ico{width:18px;height:18px;border-radius:50%;border:1px solid rgba(255,255,255,.5);background:radial-gradient(circle at 35% 35%,#fff8,#c9a7ff33)}
.light .ico.crystal{border-radius:3px;transform:rotate(45deg) scale(.8);background:radial-gradient(circle,#ffe7a8,#f2c46d44)}
.dock{position:fixed;left:0;right:0;bottom:0;z-index:4;padding-bottom:calc(14px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;align-items:center;gap:10px;pointer-events:none}
.dock > *{pointer-events:auto}
.whisper{font-family:var(--display);font-style:italic;font-size:clamp(20px,4.6vw,28px);text-align:center;text-wrap:balance;color:var(--ink);text-shadow:0 0 18px #9b7bff88;max-width:34ch;min-height:1.3em;transition:opacity .8s}
.paper{width:min(640px,100%);background:var(--paper);color:var(--paper-ink);border-radius:4px 10px 6px 12px;box-shadow:0 8px 30px #0008;padding:10px 10px 10px 14px;display:flex;gap:8px;align-items:flex-end}
.paper textarea{flex:1;min-width:0;border:0;background:transparent;font:16px/1.45 var(--body);color:var(--paper-ink);resize:none;outline:none;max-height:120px}
.paper textarea::placeholder{color:#7a6c8f}
.btn{font:600 14px var(--body);border:0;border-radius:999px;padding:9px 14px;cursor:pointer;background:var(--paper-ink);color:var(--paper);white-space:nowrap}
.btn:focus-visible,.ghost:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.btn[disabled]{opacity:.45;cursor:default}
.row{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.ghost{font:600 13px var(--body);border:1px solid rgba(236,230,246,.35);background:rgba(27,21,48,.55);color:var(--ink);border-radius:999px;padding:8px 14px;cursor:pointer;backdrop-filter:blur(4px)}
.card{position:fixed;z-index:5;left:50%;top:50%;transform:translate(-50%,-50%);width:min(440px,calc(100% - 32px));background:rgba(27,21,48,.92);border:1px solid rgba(201,167,255,.3);border-radius:14px;padding:18px;box-shadow:0 10px 40px #000a;display:flex;flex-direction:column;gap:12px}
.card h2{font:600 22px var(--display);margin:0}
.card p{margin:0;line-height:1.5;color:var(--ink)}
.card .meta{font-size:12px;color:var(--mist)}
[hidden]{display:none!important}
.card .paper{box-sizing:border-box}
.thought{font:500 20px/1.4 var(--display);font-style:italic;overflow-wrap:anywhere}
.owl{position:fixed;z-index:3;right:max(18px,env(safe-area-inset-right,0px));top:calc(54px + env(safe-area-inset-top,0px));font:italic 600 18px var(--display);color:var(--gold);opacity:0;transition:opacity 1s;pointer-events:none}
.toast{position:fixed;z-index:6;left:50%;top:calc(60px + env(safe-area-inset-top,0px));transform:translateX(-50%);background:rgba(27,21,48,.9);border:1px solid rgba(242,196,109,.4);padding:8px 14px;border-radius:999px;font-size:13px;opacity:0;transition:opacity .5s;pointer-events:none;max-width:calc(100% - 32px);text-align:center}
.note{font-size:11px;color:var(--mist);text-align:center;max-width:52ch}

<script>
/* Website version: the game talks to Firebase instead of the Claude artifact database. */
(function(){
  var CFG=window.FIREBASE_CONFIG||null; /* filled from firebase-config.js */
  if(!CFG||!window.firebase){return}
  firebase.initializeApp(CFG);
  var ready=firebase.auth().signInAnonymously().then(function(c){return c.user}).catch(function(){return null});
  window.claude={use:function(n){return ready.then(function(u){
    if(!u)return null;
    if(n==="db")return firebase.firestore();
    if(n==="user")return {id:function(){return Promise.resolve(u.uid)}};
    return null})}};
})();
</script>

function placeOf(id,t){const h=hash(id),r=rng(h);const bx=0.12+r()*0.76,by=0.14+r()*0.62;return[(bx+Math.sin(t*0.05+h)*0.04)*W,(by+Math.cos(t*0.04+h%7)*0.035)*H]}

function bubbleLook(){
  const T=me.traits;
  return{
    clarity:clamp(T.O/100,0.1,1),          // open = see-through
    thorns:T.A<42?Math.round((42-T.A)/3)+3:0, // argumentative = thorns
    wobble:clamp((T.N-40)/60,0,1),        // sensitive = colours shift easily
  };
}

function drawObject(o,x,y,r,t){

    case"window":P.rect(x-r*.6,y-r*.8,r*1.2,r*1.4);P.moveTo(x,y-r*.8);P.lineTo(x,y+r*.6);P.moveTo(x-r*.6,y-r*.1);P.lineTo(x+r*.6,y-r*.1);break;
    case"tree":P.moveTo(x,y+r*.8);P.lineTo(x,y-r*.1);P.arc(x,y-r*.4,r*.55,0,7);break;
    case"sea":for(let k=0;k<3;k++){P.moveTo(x-r,y+k*6);for(let i=0;i<=8;i++)P.lineTo(x-r+i*r/4,y+k*6+Math.sin(t*2+i+k)*3)}break;
    case"cup":P.rect(x-r*.4,y-r*.2,r*.8,r*.7);P.moveTo(x+r*.4,y);P.arc(x+r*.55,y+r*.1,r*.18,-1.5,1.5);for(let k=0;k<2;k++){P.moveTo(x-r*.1+k*r*.2,y-r*.3);P.quadraticCurveTo(x+k*r*.2,y-r*.6+Math.sin(t*2)*3,x-r*.1+k*r*.2,y-r*.9)}break;
    case"house":P.moveTo(x-r*.6,y+r*.6);P.lineTo(x-r*.6,y-r*.1);P.lineTo(x,y-r*.7);P.lineTo(x+r*.6,y-r*.1);P.lineTo(x+r*.6,y+r*.6);P.closePath();break;
    case"book":P.moveTo(x,y-r*.4);P.quadraticCurveTo(x-r*.5,y-r*.6,x-r*.8,y-r*.4);P.lineTo(x-r*.8,y+r*.4);P.quadraticCurveTo(x-r*.5,y+r*.2,x,y+r*.4);P.quadraticCurveTo(x+r*.5,y+r*.2,x+r*.8,y+r*.4);P.lineTo(x+r*.8,y-r*.4);P.quadraticCurveTo(x+r*.5,y-r*.6,x,y-r*.4);P.lineTo(x,y+r*.4);break;
    case"star":for(let k=0;k<5;k++){const a=k*1.2566-1.57;P.lineTo(x+Math.cos(a)*r*.6,y+Math.sin(a)*r*.6);P.lineTo(x+Math.cos(a+.628)*r*.25,y+Math.sin(a+.628)*r*.25)}P.closePath();break;
    case"moon":P.arc(x,y,r*.5,.6,5.7);P.quadraticCurveTo(x+r*.1,y,x+r*.4,y+r*.28);break;
    case"sun":P.arc(x,y,r*.35,0,7);for(let k=0;k<8;k++){const a=k*.785+t*.2;P.moveTo(x+Math.cos(a)*r*.5,y+Math.sin(a)*r*.5);P.lineTo(x+Math.cos(a)*r*.75,y+Math.sin(a)*r*.75)}break;

    case"rain":for(let k=0;k<7;k++){const yy=y-r+((t*60+k*23)%(r*2));P.moveTo(x-r+k*r/3,yy);P.lineTo(x-r+k*r/3-3,yy+8)}break;
    case"snow":for(let k=0;k<7;k++){const yy=y-r+((t*20+k*23)%(r*2));P.moveTo(x-r+k*r/3+2,yy);P.arc(x-r+k*r/3,yy,2,0,7)}break;
    case"cat":P.ellipse(x,y+r*.2,r*.5,r*.3,0,0,7);P.moveTo(x+r*.3,y-r*.1);P.arc(x+r*.35,y-r*.15,r*.22,0,7);break;

      inner.splice(j,1);j--;burstAt();changed=true}}
  // 4. very old sugs become the land of the bubble
  while(inner.length>3&&(inner.length>9&&now-inner[0].ts>LIFE.land||now-inner[0].ts>LIFE.land*3)){const x=inner.shift();me.land.push({h:(x.g.hues||[270])[0],d:!!x.g.dark,o:x.g.objects||[]});changed=true}
  me.land=me.land.slice(-40);
  // 5. an answered thought comes home along its thread, changed
  if(dbOk&&me.id&&db)world.filter(s=>s.owner===me.id&&!s.home&&(s.replies||0)>0&&now-(s.ts||now)>LIFE.home&&!me.returned[s.id]).forEach(s=>{me.returned[s.id]=1;
    inner.push({g:Object.assign({},s.g,{mixH:(s.replyHues||[]).slice(-4),parts:[...new Set([...(s.g.parts||[]),...(s.parts||[])])],came:1}),ts:now});
    db.doc("sugs/"+s.id).update({home:true}).catch(()=>{});toast(T("Сулласан бодол чинь утсаараа гэртээ буцаж ирлээ."));burstAt();changed=true});
  if(changed)save();
}
setInterval(lifeTick,5000);
// ---------- UI ----------
const whisper=$("whisper"),input=$("input"),form=$("form"),note=$("note");
const typing=makeTyping(input), replyTyping=makeTyping($("replyInput"));
function toast(msg){const el=$("toast");el.textContent=msg;el.style.opacity=1;clearTimeout(toast.t);toast.t=setTimeout(()=>el.style.opacity=0,2600)}
function lights(){$("innerFill").style.width=me.inner+"%";$("outerFill").style.width=me.outer+"%"}
const WHISPERS=["Энд юу байгаасай гэж хүсэж байна?","Өнөөдөр чамд юу хамгийн их санагдав?","Хэнд ч хэлээгүй нэг бодол байна уу?","Чиний цонхоор юу харагддаг вэ?","Сүүлд хэзээ инээсэн бэ?"];
function setMode(m){
  mode=m;if(m==="world"){cam.init=false;HOOD=null}releasing=false;$("closeCard").click&&($("readCard").hidden=true);
  $("actions").hidden=m==="wake";
  $("goOut").hidden=m!=="home";$("goHome").hidden=m!=="world";$("releaseMode").hidden=m!=="home";
  form.hidden=m==="world";
  if(m==="wake"){whisper.textContent=T(WHISPERS[0]);note.textContent=T("Бичсэн үг чинь биежинэ. Хэрхэн бичсэн нь ч гэсэн.")}
  if(m==="home"){whisper.textContent=T(WHISPERS[(me.writes)%WHISPERS.length]);note.textContent=T("Энд бичсэн зүйл зөвхөн чиний бөмбөлөгт үлдэнэ.");input.placeholder=T("Бич…")}
  if(m==="world"){whisper.textContent=T("Төөрсөн бодол дээр дарж, сонсоорой.");note.textContent=T("Цэнхэр утас бүрийн цаана нэг хүн бий.")}
}
$("goOut").onclick=()=>{if(me.inner<20){toast(T("Дотоод гэрэл чинь хэтэрхий бүдэг байна. Эхлээд гэртээ нэг зүйл бүтээ."));return}setMode("world")};
$("goHome").onclick=()=>setMode("home");
$("releaseMode").onclick=()=>{releasing=!releasing;$("releaseMode").textContent=releasing?T("Болих"):T("Бодлоо сулла");whisper.textContent=releasing?T("Энэ бодол чинь ертөнцөөр төөрнө. Хэн нэгэн олж сонсож магад."):T(WHISPERS[me.writes%WHISPERS.length]);note.textContent=releasing?T("Сулласан бодол нэргүйгээр бусдад харагдана. Хувийн мэдээлэл бүү бич."):T("Энд бичсэн зүйл зөвхөн чиний бөмбөлөгт үлдэнэ.");input.placeholder=releasing?T("Сулласан бодол…"):T("Бич…");input.focus()};

input.addEventListener("keydown",e=>{if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();form.requestSubmit()}});
$("replyInput").addEventListener("keydown",e=>{if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();$("replyForm").requestSubmit()}});

form.addEventListener("submit",async e=>{
  e.preventDefault();const text=input.value.trim();if(!text)return;
  const g=analyze(text,typing.read(),me);g.seed=hash(text+Date.now());updateTraits(me,g);
  input.value="";input.style.height="auto";typing.reset();
  if(releasing&&dbOk){
    try{await db.collection("sugs").add({owner:me.id,text:text.slice(0,280),g,replyHues:[],replies:0,ts:Date.now()});me.inner=clamp(me.inner+4,0,100);sugSong(g);toast(T("Бодол чинь цэнхэр утсаа чирсээр ертөнц рүү гарлаа."));$("releaseMode").click()}
    catch(err){toast(T("Сулалж чадсангүй. Дахин оролдоорой."))}
  }else{
    if(g.parts.length&&inner.length){const prev=inner[inner.length-1].g;prev.parts=[...new Set([...(prev.parts||[]),...g.parts])];g.parts=[]}
    if(g.excl>=2||g.caps){g.hand=(g.hand+1+g.excl%3)%4;stirs.push({x:W/2,y:H*.44,vx:0,vy:0,t:performance.now()/1000,burst:1})}
    inner.push({g,ts:Date.now()});sugSong(g);me.writes++;me.inner=clamp(me.inner+(me.inner<60?12:6),0,100);
    if(mode==="wake"&&me.writes>=2){setMode("home");toast(T("Хана чинь туналлаа. Гадагш гарч болно."))}
    else if(mode==="wake")whisper.textContent=WHISPERS[1];
    else whisper.textContent=T(WHISPERS[me.writes%WHISPERS.length]);
    if(g.objects.length)toast(T("Бөмбөлөг дотор чинь шинэ зүйл биежлээ."));
  }
  save();lights();
});

// world interaction
let reading=null;
const ptrs=new Map();let dragMoved=false,pinch=null;cv.style.touchAction="none";
cv.addEventListener("pointerdown",e=>{if(mode!=="world")return;ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY,x0:e.clientX,y0:e.clientY,cx0:cam.x,cy0:cam.y});dragMoved=false;
  if(ptrs.size===2){const[a,b]=[...ptrs.values()];pinch={d:Math.hypot(a.x-b.x,a.y-b.y),z:cam.z}}});
addEventListener("pointermove",e=>{const p=ptrs.get(e.pointerId);if(!p||mode!=="world")return;p.x=e.clientX;p.y=e.clientY;
  if(ptrs.size===2&&pinch){const[a,b]=[...ptrs.values()];cam.z=clamp(pinch.z*Math.hypot(a.x-b.x,a.y-b.y)/(pinch.d||1),.3,1.8);dragMoved=true;return}
  const dx=p.x-p.x0,dy=p.y-p.y0;if(Math.hypot(dx,dy)>6)dragMoved=true;if(dragMoved){cam.x=clamp(p.cx0-dx/cam.z,-WR,WR);cam.y=clamp(p.cy0-dy/cam.z,-WR,WR+160)}});
const ptrEnd=e=>{ptrs.delete(e.pointerId);if(ptrs.size<2)pinch=null;if(ptrs.size===1){const q=[...ptrs.values()][0];q.x0=q.x;q.y0=q.y;q.cx0=cam.x;q.cy0=cam.y}};
addEventListener("pointerup",ptrEnd);addEventListener("pointercancel",ptrEnd);
cv.addEventListener("wheel",e=>{if(mode!=="world")return;e.preventDefault();const r=cv.getBoundingClientRect(),sx=e.clientX-r.left,sy=e.clientY-r.top,wx=(sx-LASTVT.ox)/LASTVT.z,wy=(sy-LASTVT.oy)/LASTVT.z;cam.z=clamp(cam.z*Math.exp(-e.deltaY*.0015),.3,1.8);cam.x=wx-(sx-W/2)/cam.z;cam.y=wy-(sy-H/2)/cam.z},{passive:false});
cv.addEventListener("click",e=>{
  if(mode==="wake")return;if(mode==="world"&&dragMoved){dragMoved=false;return}const r=cv.getBoundingClientRect(),x=(e.clientX-r.left-LASTVT.ox)/LASTVT.z,y=(e.clientY-r.top-LASTVT.oy)/LASTVT.z;
  const h=hit.slice().reverse().find(h=>Math.hypot(h.x-x,h.y-y)<h.r/(mode==="world"?Math.min(1,LASTVT.z):1));
  if(!h){if(mode==="world"){const b=bhit.find(b=>Math.hypot(b.x-x,b.y-y)<b.r+12);if(b){if(b.id===me.id)setMode("home");else{stirs.push({x:e.clientX,y:e.clientY,vx:0,vy:0,t:performance.now()/1000,burst:1});toast(T("Хана нь хаалттай. Дотор нь юу байгааг гаднаас харахгүй."))}}}return}
  audioInit();if(h.s.g)sugSong(Object.assign({},h.s.g,{dark:h.s.g.dark&&!(replies.filter(r=>r.sugId===h.s.id&&r.g&&!r.g.dark).length>=2)}));stirs.push({x:e.clientX,y:e.clientY,vx:0,vy:0,t:performance.now()/1000,burst:1});
  const card=$("readCard");card.style.opacity=0;card.style.transition="opacity .9s";setTimeout(()=>card.style.opacity=1,650);
  reading=h.s;$("readText").textContent="“"+h.s.text+"”";
  const n=replies.filter(r=>r.sugId===h.s.id).length;
  $("readMeta").textContent=(h.s.owner===me.id?T("Чиний сулласан бодол. "):"")+(n?n+T(" хүн энэ бодолтой нийлсэн."):T("Одоохондоо хэн ч хариулаагүй."));
  $("replyForm").hidden=h.s.owner===me.id;$("readCard").hidden=false;if(h.s.owner!==me.id)$("replyInput").focus();
});
$("closeCard").onclick=()=>{$("readCard").hidden=true;reading=null};
addEventListener("keydown",e=>{if(e.key==="Escape"&&!$("readCard").hidden)$("closeCard").click()});
$("replyForm").addEventListener("submit",async e=>{
  e.preventDefault();const text=$("replyInput").value.trim();if(!text||!reading||!dbOk)return;
  const g=analyze(text,replyTyping.read(),me);g.seed=hash(text+Date.now());updateTraits(me,g);
  $("replyInput").value="";replyTyping.reset();
  const target=reading;$("readCard").hidden=true;sugSong(g);
  const[x1,y1]=SPOS[target.id]||[W/2,H/2];flights.push({g,x0:W/2,y0:H-120,x1,y1,start:performance.now()});
  try{
    await db.collection("replies").add({sugId:target.id,from:me.id,toOwner:target.owner,text:text.slice(0,280),g,ts:Date.now()});
    const hues=(target.replyHues||[]).concat(g.hues.slice(0,1)).slice(-6);
    const np=[...new Set([...(target.parts||[]),...(g.parts||[])])].slice(0,9);
    await db.doc("sugs/"+target.id).update({replyHues:hues,replies:(target.replies||0)+1,parts:np});
    if(g.dark){me.outer=clamp(me.outer-8,0,100);toast(T("Чиний үг харанхуй байлаа. Буланд нэг хар дүрс нэмэгдлээ."))}
    else{me.outer=clamp(me.outer+10,0,100);me.inner=clamp(me.inner+3,0,100);toast(T("Чиний үг тэр бодолтой нийллээ."))}
    save();lights();
  }catch(err){toast(T("Хариу хүрсэнгүй. Дахин оролдоорой."))}
});

// slow decay + owl
setInterval(()=>{
  if(mode==="world"){me.inner=clamp(me.inner-1,0,100);lights();save()}
  const owl=$("owl");owl.style.opacity=(mode==="world"&&me.inner<25)?1:0;
},20000);

// replies to my sugs, seen when I come back
function checkReturned(){
  if(!me.id)return;const mine=new Set(world.filter(s=>s.owner===me.id).map(s=>s.id));
  const got=replies.filter(r=>mine.has(r.sugId)&&r.from!==me.id&&!me.seenReplies[r.id]);
  if(got.length){got.forEach(r=>me.seenReplies[r.id]=1);const good=got.filter(r=>!(r.g&&r.g.dark)).length;me.outer=clamp(me.outer+good*8,0,100);save();lights();toast(got.length===1?T("Чиний сулласан бодол буцаж ирэхдээ өөр болжээ. Хэн нэгэн сонссон."):got.length+T(" хүн чиний бодлыг сонсчээ."))}
}

// ---------- connect shared world ----------
// shared data is untrusted: rebuild a missing/odd genome from the text, drop what can't be drawn
function fixSug(s){try{if(typeof s.text!=="string"||!s.owner)return null;s.text=s.text.slice(0,280);
 const g=s.g;if(!g||!Array.isArray(g.hues)||typeof g.segs!=="number"||!g.hues.length){s.g=analyze(s.text,{cps:4,dels:0,keys:s.text.length,cv:0,pauses:0},{baseCps:4,handHue:270,traits:{O:50,A:50,N:50}});s.g.seed=hash(s.id||s.text)}
 const ok=v=>typeof v!=="number"||(isFinite(v)&&Math.abs(v)<1e15);if(!Object.values(s.g).every(ok)||!s.g.hues.every(h=>typeof h==="number"&&isFinite(h)))return null;
 if(!Array.isArray(s.replyHues)||!s.replyHues.every(h=>typeof h==="number"&&isFinite(h)))s.replyHues=[];if(s.parts&&!Array.isArray(s.parts))s.parts=[];return s}catch(e){return null}}
async function connect(){
  if(!window.claude||!window.claude.use){return}
  try{
    const [d,u]=await Promise.all([claude.use("db"),claude.use("user")]);
    if(u&&u.id){const id=await u.id();if(id&&id!==me.id){me.seenReplies={};setHand(id)}}
    if(!d)return;db=d;
    const timer=setTimeout(()=>{if(!dbOk)toast(T("Хуваалцах ертөнц удаан ачаалж байна."))},10000);
    db.collection("sugs").orderBy("ts","asc").limit(200).onSnapshot(snap=>{dbOk=true;clearTimeout(timer);world=snap.docs.map(d=>Object.assign({id:d.id},d.data())).map(fixSug).filter(Boolean);checkReturned()},()=>{});
    db.collection("replies").orderBy("ts","asc").limit(400).onSnapshot(snap=>{replies=snap.docs.map(d=>Object.assign({id:d.id},d.data()));checkReturned()},()=>{});
  }catch(e){}
}

setMode(mode);lights();connect();
window.__sug={analyze,me,drawSug,inner,test:(w,r)=>{world=w;replies=r;dbOk=true;me.id=me.id||"me1"},setMode,spos:()=>SPOS,hood:()=>HOOD}; // for testing
})();
</script>
